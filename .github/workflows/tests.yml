# What the pre-commit hook runs, on a clean checkout: the scripts tests (tracker, secret check,
# hook), the tracking node tests, and make check (pytest and vitest, ruff and eslint, mypy and
# tsc). No secrets and no LIVE: the Meta client refuses live calls without LIVE=1, and the
# network guard (services/api/tests/network_guard.py, installed by conftest.py) fails any test
# that reaches a host other than loopback. Tests marked live are skipped.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Three replay tests skip here (services/api/tests/recorded_png.py): their recorded
    # request holds a PNG encoded on macOS, and Linux encodes the same pixels to other bytes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: liblouis (braille)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblouis-bin liblouis-data
          lou_translate --version | head -1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          (cd services/api && uv sync --locked)
          (cd apps/web && npm ci)

      - name: Scripts tests
        run: python3 -m unittest scripts/test_tracker.py scripts/test_check_secrets.py scripts/test_pre_commit.py scripts/test_preflight.py scripts/test_results.py

      - name: Tracking node tests
        working-directory: spikes/tracking
        run: node --test --test-reporter=dot test/*.test.mjs

      - name: make check
        run: make -s check
