<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracking spike</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #555; --accent: #0a6; --warn: #b60; --line: #ccc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #aaa; --accent: #3c9; --warn: #fb5; --line: #444; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  button, select, input { font: inherit; padding: 6px 10px; }
  #view { width: 100%; max-width: 1280px; border: 1px solid var(--line); display: block; cursor: crosshair; }
  #stats { font: 13px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
  #status { font-weight: 600; min-height: 1.4em; }
  #target { font-size: 96px; font-weight: 700; text-align: center; color: var(--accent); min-height: 1.2em; }
  #results { font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  video { display: none; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<h1>Tracking spike</h1>
<p>Camera, hand landmarks in a worker, homography from 4 clicked corners, fingertip in sheet millimeters, and a 9 point touch test.
Keys: <kbd>R</kbd> recalibrate, <kbd>T</kbd> start the touch test, <kbd>Space</kbd> record a touch now, <kbd>Escape</kbd> stop speech.</p>
<div class="row">
  <label>Camera <select id="camera"></select></label>
  <button id="start">Start camera</button>
  <button id="calibrate" disabled>Calibrate (R)</button>
  <button id="test" disabled>Touch test (T)</button>
  <label>Contact offset mm <input id="offset" type="number" step="0.5" value="4" style="width: 5em"></label>
</div>
<div id="status" aria-live="polite"></div>
<div id="target" aria-hidden="true"></div>
<canvas id="view" width="1280" height="720"></canvas>
<video id="video" playsinline muted></video>
<div id="stats"></div>
<div id="results"></div>
<script type="module" src="./main.js"></script>
<script type="module" src="./calib.js"></script>
<script type="module" src="./touchtest-ui.js"></script>
</body>
</html>
