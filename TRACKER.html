<section class="hb" id="hb-start"><h2>How this file works</h2>
<p>This file is the project's memory. It holds every task, gate, metric, decision, risk, issue, contact and log entry, plus this handbook. It lives in the repo root as <code>TRACKER.html</code> and opens in any browser, with no server.</p>
<h3>Three ways it stays current</h3>
<ol><li><b>Your clicks.</b> Ticking a task or editing a note saves to this browser at once.</li>
<li><b>Save to file.</b> Writes everything back into TRACKER.html, so it can be committed. In Chrome or Edge it saves in place after the first time. Other browsers download a fresh copy, which you move into the repo.</li>
<li><b>Claude Code.</b> It updates this file only through <code>scripts/tracker.py</code>, whenever it starts or finishes a task. When you next open the file, its changes are merged with anything you did in the browser. For each task or note, the newest edit wins.</li></ol>
<p class="note">A web page cannot watch your repo by itself. Nothing updates unless you, or Claude Code, change it. The "Changes not saved to file" label tells you when the browser copy is ahead of the file.</p>
<h3>Add this to CLAUDE.md</h3>
<pre id="p-claude">## Tracker
TRACKER.html is the project memory. Update it only with scripts/tracker.py, never by hand.
- Start of every session: python scripts/tracker.py show
- Starting a task: python scripts/tracker.py status &lt;id&gt; doing
- Finishing: python scripts/tracker.py status &lt;id&gt; done --note "what was done and measured"
- Blocked or cut: the same command, with the reason in --note
- New task: python scripts/tracker.py add &lt;day&gt; TITLE [--detail TEXT] [--timebox TEXT] [--fallback TEXT] [--tags a,b]
- Numbers: tracker.py metric. Bugs: tracker.py issue. Choices: tracker.py decision. Gates: tracker.py gate.</pre>
<div class="cp"><span class="muted">Paste it under the Never section of CLAUDE.md.</span><button class="btn" data-act="copy" data-src="p-claude">Copy</button></div>
<p class="note warn">If Claude Code changed this file while this tab was open, reload the tab before you press Save to file. Otherwise the save overwrites its changes.</p>
<h3>Daily routine</h3>
<ol><li>Morning: open the file, read Today, press Copy session brief, paste it into Claude Code.</li>
<li>During the day: tick tasks, add notes, record numbers in Metrics, log anything surprising.</li>
<li>Evening: one log entry, Save to file, commit with the code.</li></ol>
<h3>Backups</h3><p>Export JSON before risky edits. Import JSON restores it. Reset to file throws away browser changes and reloads what the file holds.</p>

<section class="hb" id="hb-idea"><h2>The idea in one minute</h2>
<p>A teacher uploads a science figure. Muse Spark names its parts, SAM 3.1 outlines each one, and code turns them into a printable sheet that follows tactile design rules. Traced with puffy paint, it becomes a raised graphic.</p>
<p>A blind student puts the sheet under a phone camera. When a finger rests on a part, the app says its name. The student asks questions out loud and gets short answers drawn only from that figure.</p>
<p><b>Why it matters:</b> by hand, one tactile figure takes 1 to 5 hours, or 200 to 1,000 hours per textbook. Older talking systems needed QR codes, color tags or special tablets on every sheet.</p>
<p><b>What is new:</b> no markers at all, one region map that drives both the print and the speech, and answers grounded in code computed geometry.</p>
</section>

<section class="hb" id="hb-arch"><h2>Architecture</h2>
<ul><li><b>Browser.</b> React and TypeScript strict, built with Vite. Routes <code>/author</code> and <code>/explore</code>. Hand tracking in a Web Worker.</li>
<li><b>Backend.</b> Python 3.11 and FastAPI in one process. SQLite and files under <code>data/figures/&lt;sha256&gt;/</code>.</li>
<li><b>Meta layer.</b> One client wrapper with timeouts, retry with backoff and jitter, a semaphore of 4 for SAM, a cache and a cost meter. <code>MOCK_META=1</code> replays fixtures.</li>
<li><b>Local libraries.</b> OpenCV, shapely, liblouis with the UEB grade 2 table, cairosvg.</li></ul>
<h3>Routes</h3>
<table><tbody>
<tr><td><code>POST /api/figures</code></td><td>Upload, start the pipeline</td></tr>
<tr><td><code>GET /api/figures/{id}</code></td><td>Status and stage timings</td></tr>
<tr><td><code>GET .../regions.json, tactile.svg, print.pdf</code></td><td>Outputs</td></tr>
<tr><td><code>PATCH /api/figures/{id}/regions/{rid}</code></td><td>Teacher edits</td></tr>
<tr><td><code>POST /api/figures/{id}/publish</code></td><td>Lock a reviewed version</td></tr>
<tr><td><code>POST /api/register</code></td><td>One frame in, corners, rotation, confidence out</td></tr>
<tr><td><code>POST /api/ask</code></td><td>Question in, answer streamed as server-sent events</td></tr>
<tr><td><code>WS /api/voice</code></td><td>Audio relay to Muse Voice Transcribe</td></tr>
</tbody></table>

<section class="hb" id="hb-contract"><h2>The regions.json contract</h2>
<p>The hand-off between Author and Explore. Explore needs nothing else to speak labels, play earcons and guide. Changing it needs a version bump.</p>
<ul><li>Top level: schema_version, figure_id (sha256), title, figure_type, grade_band, page size in mm, summary, textures (at most 5).</li>
<li>Each region: id, label, abbrev, description, polygon_mm (at most 200 points), centroid_mm, texture, parent, neighbors with direction, source (sam or teacher), confidence, verified_by_teacher.</li>
<li>Neighbor directions are computed in code: up, down, left, right, the four diagonals, inside, around.</li></ul>
</section>

<section class="hb" id="hb-pipeline"><h2>Authoring pipeline</h2>
<ol><li><b>S0 Ingest.</b> Check type and size, render the PDF page, straighten a photo, reject blur, resize to 2048 px, hash.</li>
<li><b>S1 Understand, Muse Spark.</b> Type, title, summary, up to 25 parts as short phrases, color meaning, verdict: tactile, split, or words only.</li>
<li><b>S2 Ground, SAM 3.1.</b> One call per phrase, four at a time, plus one for print text.</li>
<li><b>S3 Reconcile.</b> Code merges and nests. Then Spark sees numbered outlines and says which number is which label. It never writes a coordinate.</li>
<li><b>S4 Layout.</b> Polygons in mm, gaps, textures, point symbols, braille or a key.</li>
<li><b>S5 Render.</b> SVG in layers, print PDF with a 100 mm calibration bar, regions.json, validation report.</li>
<li><b>Rules check.</b> A failure stops the job and names the rule and region.</li>
<li><b>S6 Review.</b> Teacher approves, edits, merges, deletes or adds by name, then publishes.</li></ol>
<h3>Tactile rules and their sources</h3>
<table><tbody>
<tr><td>Gap between raised elements</td><td>3.2 mm (1/8 inch)</td><td>tactilegraphics.org</td></tr>
<tr><td>Smallest point symbol</td><td>6.4 mm (1/4 inch)</td><td>APH handout</td></tr>
<tr><td>Area textures per sheet</td><td>5, or 3 for lower grades</td><td>APH handout</td></tr>
<tr><td>Braille dot base</td><td>1.5 to 1.6 mm</td><td>BANA signage guidelines</td></tr>
<tr><td>Cell to cell</td><td>6.1 to 7.6 mm</td><td>BANA signage guidelines</td></tr>
<tr><td>Braille line spacing</td><td>10.2 mm</td><td>NPS tactile map guidelines</td></tr>
<tr><td>Principle</td><td>Represent, do not interpret</td><td>APH handout</td></tr>
</tbody></table>
<p class="muted">Signage values are a starting point. Confirm against the BANA 2022 tactile graphics guidelines before printing.</p>
</section>

<section class="hb" id="hb-explore"><h2>Explore loop</h2>
<ol><li><b>Register.</b> Spoken notice, one frame to the server. OpenCV outline first, SAM fallback. Four rotations compared with the rendered SVG. Low confidence gives spoken help. R repeats it.</li>
<li><b>Track.</b> MediaPipe Hand Landmarker in a worker, two hands, 21 points each. The pointing hand has the index finger out and the others curled.</li>
<li><b>Contact point.</b> The fingertip moved back along the finger by a tuned offset, because contact is under the pad.</li>
<li><b>Smooth.</b> 1 euro filter. Tune by setting beta to 0 and lowering the min cutoff until jitter at rest is gone, then raising beta until fast moves stop lagging.</li>
<li><b>Map.</b> Homography from camera pixels to sheet mm.</li>
<li><b>Decide.</b> Point-in-polygon, smallest region first, then the state machine.</li></ol>
<h3>When to speak</h3>
<table><tbody>
<tr><td>Outside to Entering</td><td>finger inside the region shrunk by 1 mm</td></tr>
<tr><td>Entering to Inside</td><td>held 120 ms, play the texture earcon</td></tr>
<tr><td>Inside to Dwelled</td><td>slower than 15 mm/s for 600 ms, speak the label</td></tr>
<tr><td>Inside or Dwelled to Leaving</td><td>finger outside the region grown by 2 mm</td></tr>
<tr><td>Leaving to Outside</td><td>out for 120 ms, soft exit tick</td></tr>
</tbody></table>
<p>Earcons are capped at 6 per second. All values live in <code>config/explore.yaml</code> and are tuned with the touch eval.</p>
<p class="note warn">A camera cannot tell touching from hovering just above the sheet. We rely on dwell time and say so in the README.</p>
<h3>Guidance mode</h3><p>"Where is the aorta" is handled on the device. The direction is spoken once, then beeps speed up with distance, then a chime and the label on arrival.</p>
</section>

<section class="hb" id="hb-voice"><h2>Voice questions</h2>
<ol><li>Hold Space. The mic opens and app speech pauses.</li>
<li>Mono 16-bit PCM goes over a WebSocket to the backend, then to Muse Voice with region labels as keyword hints. Muse Voice takes 24 kHz, its native rate, or 16 kHz, which it resamples. The Day 1 spike picks one.</li>
<li>On release, the local intent parser handles where is, more, repeat, stop and what is here.</li>
<li>Anything else goes to <code>/api/ask</code> with the region, the last two regions and computed spatial facts.</li>
<li>Muse Spark streams. The first sentence is spoken as soon as it is complete. Space cancels and listens again.</li></ol>
<p class="note">Fallback: if realtime streaming is awkward, record while Space is held and send the whole clip once to <code>POST /v1/asr/transcribe</code> as a WAV.</p>
<h3>Rules for answers</h3>
<ul><li>One or two sentences. "More" gives detail.</li>
<li>Only from the figure. If it is not shown, say so.</li>
<li>No sight words. Never "as you can see".</li>
<li>Directions and distances come from code, never from the model.</li></ul>
</section>

<section class="hb" id="hb-budgets"><h2>Speed, memory and cost</h2>
<table><tbody>
<tr><td>Touch to earcon</td><td>under 100 ms</td></tr>
<tr><td>Dwell to label</td><td>dwell plus under 150 ms</td></tr>
<tr><td>Release Space to first word</td><td>under 2 s</td></tr>
<tr><td>Upload to review screen</td><td>under 90 s</td></tr>
</tbody></table>
<ul><li>One frame in flight. Drop frames, never queue. No pixels back from the worker.</li>
<li>Images capped at 2048 px. Masks as 1-bit PNG. Polygons at most 200 points.</li>
<li>Same figure twice costs nothing: every stage is cached by content hash.</li>
<li>A budget miss is an issue with the measured number.</li></ul>
</section>

<section class="hb" id="hb-rules"><h2>Hard rules</h2>
<ul><li>The API key never reaches the browser.</li>
<li>Camera frames stay on the device, except the single registration frame, sent after a spoken notice and never stored.</li>
<li>No magic numbers in geometry. Everything comes from <code>config/tactile_rules.yaml</code>.</li>
<li>The renderer fails loudly rather than shrinking past a minimum.</li>
<li>Every Meta response used in a test or the demo is recorded as a fixture.</li>
<li>Everything in Explore works from the keyboard. Space talks, R recalibrates, Escape stops speech, H replays help.</li>
<li>App voice or screen reader, never both.</li>
<li>Nothing from Enhancements before Gate C. Freeze at noon on Nov 3.</li>
<li>A task 50 percent over its time box takes its fallback.</li></ul>
</section>

<section class="hb" id="hb-scope"><h2>Not building, and why</h2>
<ul><li>Accounts and login, because one teacher and one student on one machine is the demo.</li>
<li>Redis, Celery, Postgres, Kubernetes, microservices, because one process handles this load.</li>
<li>Training or fine tuning, because zero-shot SAM 3.1 is the point.</li>
<li>OpenCV in the browser, because a 4 point homography is a few lines of math.</li>
<li>Muse Image, because a generated picture must never replace the textbook figure.</li>
<li>A native app or glasses SDK, because a browser is enough for now.</li>
<li>Braille math codes. Math labels stay audio only.</li></ul>
<p class="note">The test for any new idea: does it make the Nov 4 demo more likely to work, or only more likely to impress? If only the second, it waits.</p>
</section>

<section class="hb" id="hb-edges"><h2>Edge cases</h2>
<table><tbody>
<tr><td>Photo at an angle</td><td>Straighten from the page outline</td></tr>
<tr><td>Blurry or tiny image</td><td>Reject with a plain reason</td></tr>
<tr><td>Figure is a photograph</td><td>Recommend words only</td></tr>
<tr><td>40 or more labels</td><td>Suggest two sheets</td></tr>
<tr><td>Meaning in color only</td><td>Map to at most 5 textures, otherwise merge or split</td></tr>
<tr><td>SAM misses a part</td><td>Teacher adds it by name. Local checkpoint with a click</td></tr>
<tr><td>Outlines overlap</td><td>Contained becomes child, near duplicates merge, partial goes to the smaller</td></tr>
<tr><td>Part below the minimum</td><td>Point symbol or merge into parent</td></tr>
<tr><td>Braille does not fit</td><td>Abbreviation plus a key</td></tr>
<tr><td>Printer scaled the page</td><td>Measure the 100 mm bar</td></tr>
<tr><td>Glare or dark room</td><td>Confidence drops, spoken tip</td></tr>
<tr><td>Sheet moved</td><td>Points land off the page, ask to recalibrate</td></tr>
<tr><td>Two hands</td><td>Speak only for the pointing hand</td></tr>
<tr><td>Finger on a border</td><td>Hysteresis holds the previous part</td></tr>
<tr><td>Fast scanning</td><td>Earcons only, labels wait for a pause</td></tr>
<tr><td>App speech heard by the mic</td><td>Mic closed while speaking unless headphones</td></tr>
<tr><td>Answer not in the figure</td><td>Say so, name the closest part shown</td></tr>
<tr><td>Network drops</td><td>Labels and guidance keep working, questions pause</td></tr>
<tr><td>429 or 5xx</td><td>Backoff with jitter, "one moment" after 1.5 s</td></tr>
<tr><td>Credits low</td><td>Warn at 70 and 90 percent, switch to mock</td></tr>
</tbody></table>
</section>

<section class="hb" id="hb-eval"><h2>Evaluation</h2>
<ul><li><b>Authoring:</b> 20 openly licensed figures. Part recall, label accuracy, rule violations, seconds per figure. Baselines: 1 to 5 hours by hand, 6.3 to 10.2 minutes with the 2007 UW system.</li>
<li><b>Touch:</b> 9 point sheet, 5 touches each. Mean and p95 error in mm, hit rate on 30 touches, false switches per minute.</li>
<li><b>Latency:</b> p50 and p95 for touch to earcon and release to first word.</li>
<li><b>Voice:</b> 20 recorded questions, with and without keyword hints.</li>
<li><b>Answers:</b> 20 questions, 5 not answerable from the figure.</li>
<li><b>People:</b> find 3 parts, ask 3 questions, their own words, with consent.</li></ul>
<p>Only numbers from <code>eval/RESULTS.md</code> go in the Metrics tab, the README and the video.</p>
</section>

<section class="hb" id="hb-tester"><h2>If there is no blind tester</h2>
<p class="note warn">A blind user's experience cannot be simulated. Eyes-closed testing and AI personas measure the system, not its usefulness. Label every piece of evidence for what it is.</p>
<ol><li>Northeastern's disability services office first.</li>
<li>Remote expert review of the print PDF by a teacher of students with visual impairments or a braille transcriber.</li>
<li>Remote test of the talking layer on a flat printout, with a hosted Explore page and a sighted helper placing the sheet.</li>
<li>Ask in the hackathon Discord.</li>
<li>An evidence-based design table linking each choice to BANA, APH or CamIO user feedback.</li>
<li>Engineering tests: rules validator, replayed hand videos, screen reader and keyboard passes, eyes-closed tuning that is never cited as user feedback.</li></ol>
<p>If nothing lands, the README says: not yet tested with blind users, design follows published guidelines and research, a user study is the next step.</p>
</section>

<section class="hb" id="hb-apply"><h2>Application answers</h2>
<h3>What do you want to build?</h3>
<pre id="p-a1">I want to build Talking Tactile: science diagrams a blind student can feel with their fingers and ask questions about.

Today, turning one textbook figure into a tactile graphic takes 1 to 5 hours by hand. A whole book can take 200 to 1,000 hours (University of Washington). Older talking versions needed QR codes or special tablets, which kept them expensive and rare.

Here's my plan. Muse Spark reads the figure and names its parts. SAM 3.1 outlines each one. My code turns that into a print-ready raised sheet that follows BANA tactile guidelines.

Then a phone camera watches the sheet. When a finger stops on a part, the app says what it is. The student can ask a question out loud. Muse Voice Transcribe hears it, and Muse Spark answers from that figure only.

No markers, no special hardware. Just a camera that knows what you're touching. Theme: Push the Frontier.</pre>
<div class="cp"><span></span><button class="btn" data-act="copy" data-src="p-a1">Copy</button></div>
<h3>An AI project you recently built</h3>
<pre id="p-a2">Weavory, an MCP memory server for AI agents. It's live on npm as @weavory/mcp (github.com/DeepakKTS/weavory.ai). I built it for NandaHack 2026 at MIT Media Lab.

The problem: when agents share memory, one bad agent can plant a false fact and the rest will trust it.

So every belief is signed with Ed25519 and chained into a BLAKE3 audit log, which makes tampering visible. Agents vouch for each other, and a trust score decides what gets recalled. You can also replay what any agent believed at any past moment.

It's strict TypeScript with five MCP tools, and all 232 tests pass. In the demo, a forged approval on a $42,000 insurance claim gets caught and quarantined.

At my Twin AI co-op, I build RAG pipelines and LLM evaluation tooling on Azure OpenAI and AWS Bedrock.</pre>
<div class="cp"><span></span><button class="btn" data-act="copy" data-src="p-a2">Copy</button></div>

<section class="hb" id="hb-stuck"><h2>When you are stuck</h2>
<ul><li><b>Over the time box by half:</b> take the fallback written on the task. Record the decision.</li>
<li><b>A gate fails:</b> take its fallback the same day. Do not carry it into tomorrow.</li>
<li><b>An API behaves oddly:</b> run the meta-api-spike skill again and compare with the saved fixture.</li>
<li><b>Tracking jitters:</b> lower the 1 euro min cutoff. If fast moves lag, raise beta.</li>
<li><b>Labels flicker on borders:</b> grow the exit outline before touching the dwell time.</li>
<li><b>Registration fails:</b> better light, tape the sheet, check all four corners are in view.</li>
<li><b>A demo step is flaky:</b> cut it from the script.</li>
<li><b>Tired and behind:</b> the MVP list is the whole job. Plus and Stretch can wait.</li></ul>

  {

  {
   "id": "dec-mvm06jnbaq1b",
   "date": "2026-10-24",
   "title": "Muse Wonder has no job here",
   "decision": "Do not use muse-wonder-1.0 in the product. Muse Spark 1.3 stays on S1, S3 and answers. Only if Spark misses 80 percent part recall on the authoring eval, run S1 on Wonder for those 20 figures as a measured comparison; it is a model id change on the same request.",
   "why": "Docs (dev.meta.ai/docs/models#muse-wonder, read Oct 24): Wonder is a preview model for long-horizon agentic and multi-file coding work, at 4.00 in and 20.00 out per 1M tokens versus Spark 1.25 and 4.25 (3.2x and 4.7x), Standard mode only. Our calls are short and latency bound: answers must start in under 2 s, and the budget is 150 USD.",

  },
  {
   "id": "dec-mvm10pl867ql",
   "date": "2026-10-24",
   "title": "SAM 3.1 request shape from the docs",
   "decision": "Use model id sam-3.1 on POST /v1/responses, streamed, one noun phrase per call, one_bit masks with include_confidence, parsed with meta-sam-parser 0.1.0. Masks are box-local. PLAN.md 5.4 and 17, CLAUDE.md and .env.example updated. The live spike confirms the id against sam-3-1.",
   "why": "The API docs (dev.meta.ai/docs/sam/*, read Oct 24) use sam-3.1 and the Responses API with special-token text output, while the kit and the product page said sam-3-1 and assumed an OpenAI style call. The meta-api-spike skill says to update PLAN.md when the shape differs.",
   "changed_at": "2026-10-24T06:37:11.186Z"
  },
  {
   "id": "dec-mvmm0mh9zmgx",
   "date": "2026-10-24",
   "title": "Product code on branch early-start in a worktree",
   "decision": "Branch early-start created from main on Oct 24 and checked out as a git worktree at .worktrees/early-start (gitignored on main). All product code (apps/web, services/api, config changes, fixtures/regions, fixtures/synthetic, the extended pre-commit hook) is committed there. Spikes, TRACKER.html and TODO.md stay on main in the repo root; tracker.py always runs against the root TRACKER.html. The Meta client is an interface with a mock only until the spikes run.",
   "why": "Keeps the Oct 26 boundary: main holds only spikes and planning, so it can be shown as is if the Official Rules forbid earlier code. The worktree lets spikes run on main the moment the key arrives without switching branches, and the tracker never forks between branches.",
   "changed_at": "2026-10-24T16:24:59.090Z"
  },
  {
   "id": "dec-mvmncaozpg73",
   "date": "2026-10-24",
   "title": "Braille through lou_translate, not the Python bindings",
   "decision": "Translate labels by running lou_translate (liblouis 3.39.0 from Homebrew: brew install liblouis) as a subprocess, one call per figure with one label per line, tables from config/tactile_rules.yaml (unicode.dis, en-ueb-g2.ctb). The backend refuses to start if lou_translate is missing.",
   "why": "Checked Oct 24 on this Mac: the liblouis bindings are not on PyPI (the PyPI package named louis is an unrelated 2013 upload, not installed), and Homebrew installs them only for its own Python 3.15. They import into our 3.11 venv only by pointing it at Homebrew's site-packages, which is fragile. lou_translate works from any Python: 'left ventricle' gives the expected UEB grade 2 cells.",
   "changed_at": "2026-10-24T17:02:03.318Z"
  },
  {
   "id": "dec-mvmo3xqbu7ds",
   "date": "2026-10-24",
   "title": "Raised outlines are drawn inside each part's edge",
   "decision": "Each outline is a 1 mm band inside the part's polygon (render.outline_width_mm). The gap between two unrelated parts is the gap between their polygons; a child keeps min_gap + line width from its parent's edge, braille keeps clearance + line width from every edge, textures stay min_gap + line width inside.",
   "why": "A centered stroke would eat half its width out of every gap, so a layout that passed 3.2 mm on polygons would print 2.2 mm between raised lines. Drawing inside keeps the polygon distances honest and lets the validator check what is printed.",
   "changed_at": "2026-10-24T17:23:32.870Z"
  },
  {
   "id": "dec-mvmo3xrm3oct",
   "date": "2026-10-24",
   "title": "The braille key goes on its own page",
   "decision": "print.pdf is the sheet followed by key pages; the key lists each abbreviation used on the sheet and each texture sample with its meaning, in braille with print notes. tactile.svg is the sheet only, in layers guides, textures, outlines, braille.",
   "why": "PLAN.md S5 lists key as a tactile.svg layer, but the figure fills the page inside the 1 inch margin and a key of 5 to 25 braille rows does not fit beside it. BANA allows the key on a separate page. Explore needs only the sheet.",
   "changed_at": "2026-10-24T17:23:32.917Z"
  },
  {
   "id": "dec-mvmpu1s1k9q9",
   "date": "2026-10-24",
   "title": "Stage cache key chain",
   "decision": "Each key hashes the previous key and the digests of the upstream outputs the stage reads, plus prompt file, response schema and client cache tag for S1 and S2 (code hash, config and options for S3 to S5, edit layer for S4 and S5). Entries store a digest of their files and a hit must match it.",
   "why": "Covers every silent stale hit found in review (prompt edits, a changed S1 answer, edited mock fixtures). Keeping the previous key gives up early cutoff: S3 re-runs even when S2's output is byte-identical, which costs about 100 ms of code and no Meta call.",
   "changed_at": "2026-10-24T18:11:50.788Z"
  },
  {
   "id": "dec-mvmpu1sz43sc",
   "date": "2026-10-24",
   "title": "Figure API idempotency and locks",
   "decision": "A repeated upload returns the newest job with the same figure id, options and edit version that has not failed. One admission lock per figure for submit, edit and publish; runs of one figure queue on a second lock that admission never waits on. Edits name regions and act on the reconciled part (r3_2 is part r3); added parts are t1, t2 in edit order.",
   "why": "Two simultaneous requests cannot start two runs or take the same edit or published version, and a request never waits behind a 90 second live pipeline run. Other options (grade band, page) are a different sheet, so they get their own job.",
   "changed_at": "2026-10-24T18:11:50.821Z"
  },
  {
   "id": "dec-mvmtpv8vxq7m",
   "date": "2026-10-24",
   "title": "Publish refuses a version that breaks a tactile rule",
   "decision": "POST /api/figures/{id}/publish reads report.json written with the exact files it would copy (the newest finished job at the current edit version). Any violation returns 409 rules_violated with the edit version and, for each violation, its region ids, rule name, measured value and limit. A missing or unreadable report returns 409 rules_unchecked. No override for now: extra fields such as force are ignored. Explore loads only numbered published copies, so a refused version is never reachable. Commit dd451d0 on early-start.",
   "why": "A sheet that breaks a gap, size or braille rule cannot be read by touch, and a published version is what the student gets. Refusing at publish, against the report of that exact version, keeps a bad edit from ever reaching Explore while the previous clean version stays live. An override can come later if a teacher needs one.",
   "changed_at": "2026-10-24T20:00:34.164Z"
  },
  {
   "id": "dec-mvmvgthk436a",
   "date": "2026-10-24",
   "title": "Explore sounds and speech on a part switch, nesting and the mirror",
   "decision": "Moving straight from one part into another plays the first part's exit tick, then the next earcon; going into a child inside its parent plays only the child's earcon. The dwell clock starts at the start of the speed window that showed the slowdown, so dwell to label is hold_ms. The aria-live mirror is polite only in screen reader mode and off with the app voice.",
   "why": "The exit tick is the signal users asked for when leaving a hotspot, and a child is not left behind when entering it. A late dwell clock would add the 200 ms window to every label, against the dwell plus 150 ms budget. RULES 6.2 and 6.3 conflict when the app voice speaks and a screen reader also reads a polite region; never both wins, and the mirror stays as a visible log.",
   "changed_at": "2026-10-24T20:49:31.212Z"
  },
  {
   "id": "dec-mvmvgtiny2ai",
   "date": "2026-10-24",
   "title": "centroid_mm sits on the region's own area",
   "decision": "The pipeline puts each centroid at the inscribed circle center of the region minus any smaller region that overlaps it. Regions with nothing on them keep their old point. No schema change: same field and shape. Commit 48079bb on early-start.",
   "why": "Explore says the smallest region under a finger and guides to centroid_mm; the outer chamber's centroid was the inner core's, so guidance to it would have landed on the core.",
   "changed_at": "2026-10-24T20:49:31.249Z"
  },
  {
   "id": "dec-mvmzjx04ahiv",
   "date": "2026-10-24",
   "title": "Enter hold and the earcon budget",
   "decision": "The 120 ms enter hold (explore.yaml) stays. The 100 ms earcon budget in RULES 4 applies to the code path after the hold, from enter hold complete to the earcon call (metric lat-earcon). End to end latency on device, camera to sound, is measured separately in the Gate B touch test (metric lat-earcon-device).",
   "why": "The hold is what keeps a finger resting on a border from flickering between parts, and a fast-check property holds it to that. Cutting it to about 60 ms to fit a number would give up that guarantee. Headless, the code path is 0.3 ms p95, well inside 100 ms. Enter to earcon is 141 ms p95 because 120 ms of it is the hold, by design.",
   "changed_at": "2026-10-24T22:43:54.198Z"
  },
  {
   "id": "dec-mvn05mrodebx",
   "date": "2026-10-24",
   "title": "When the Oct 25 touch test counts as Gate B",
   "decision": "Decided on Oct 24, before the run. The touch test on Oct 25 counts as Gate B only if it follows the gate protocol: the test sheet (spikes/tracking/test-sheet.pdf, printed at 100 percent with the 100 mm bar checked), the demo phone as the camera, the planned touch count (45 touches, 9 targets times 5, as the page plans them) and normal room lighting. A run that departs from any of these is a practice run: its numbers are logged, and Gate B stays pending.",
   "why": "Fixing the protocol before the result is known means a result cannot be relabeled afterward. A bad run cannot be called practice, and a good practice run cannot be promoted to the gate.",
   "changed_at": "2026-10-24T23:00:47.371Z"
  },
  {
   "id": "dec-mvn1ms6xwe3m",
   "date": "2026-10-24",
   "title": "Demo and Gate B run the page on the demo phone itself",
   "decision": "The demo and the Gate B touch test run the page in the demo phone's own browser, not on a laptop with the phone as its webcam (Continuity Camera). The phone sits in a fixed mount for the whole run. This adds a step to the Gate B protocol decided earlier on Oct 24: the phone is mounted, and after calibration the drawn outline is checked against the printed corner marks and targets before the first touch. A run without both is a practice run.",
   "why": "The accuracy and latency numbers must come from the setup that ships: MediaPipe on the phone, the phone's camera and the phone's browser. Continuity Camera would measure the laptop's tracking instead. A fixed mount keeps the calibration valid for every touch, and checking the outline catches a bad corner tap before it reaches 45 touches.",
   "changed_at": "2026-10-24T23:42:07.164Z"
  },
  {
   "id": "dec-mvrcpo8jnd22",
   "date": "2026-10-27",
   "title": "Official Rules read by Deepak; pre-event work allowed; early-start merges into main",
   "decision": "Deepak read the Official Rules on Oct 27. Work done before Oct 26 is allowed. Branch early-start (product code from Oct 24) merges into main with a merge commit, no rebase or squash, so the Oct 24 commit dates stay as they are.",
   "why": "The early-start split existed only to keep pre-event code reversible until the rules were read. The rules allow it, so one branch is simpler and the spikes can test the shipped code directly.",
   "changed_at": "2026-10-28T00:03:22.499Z"
  },
  {
   "id": "dec-mvrdp5pmxi6p",
   "date": "2026-10-27",
   "title": "Live Meta calls are opt-in with LIVE=1, never in the pre-commit hook",
   "decision": "A live call needs LIVE=1 exactly in the process environment (never read from services/api/.env). LiveCaller refuses the real network without it and stops a run at meta.live_call_cap (25) calls. pytest installs a network guard for the whole session: any lookup or connection to a host other than loopback fails the test, even if the code swallows the error; tests marked live are skipped without LIVE=1. The pre-commit hook unsets LIVE. Commits 289758b and f70c179.",
   "why": "Every live call spends credits and needs the network. Tests and commits must be free, offline and repeatable, and a key in .env must not turn spending on by itself.",
   "changed_at": "2026-10-28T00:30:58.093Z"
  },
  {
   "id": "dec-mvrds8kz08ff",
   "date": "2026-10-27",
   "title": "Replay tests use recorded real responses; hand-written mocks stay for error cases",
   "decision": "A successful live call can be saved to fixtures/recorded/ (no headers, key redacted, image and audio as sha256 and size) and served back by ReplayTransport through the same LiveCaller code. tests/test_live_replay.py replays the Oct 27 Spark, SAM and Voice smoke responses. Hand-written responses in test_live_ledger.py and test_live_record.py stay for errors (401, 500, missing usage, cap, no recording). MockMetaClient (synthetic figure) still feeds the pipeline tests: they get replay variants once real S1 and S2 answers for a figure are recorded.",
   "why": "Real responses catch shape drift that a hand-written mock repeats. Errors are cheap and safe to fake, but costly or impossible to provoke live.",
   "changed_at": "2026-10-28T00:33:21.782Z"
  },
  {
   "id": "dec-mvttqna87t6i",
   "date": "2026-10-29",
   "title": "Repo pushed to private GitHub remote; made public only at submission",
   "decision": "origin is https://github.com/DeepakKTS/talking-tactile, created Oct 29 with gh repo create --private. main and early-start pushed; gh repo view reports visibility PRIVATE. Before the push: all-branch history grep found no credential (gitleaks and trufflehog not installed), nothing over 10 MB (largest hand_landmarker.task 7.46 MB), video under eval/ ignored. The repo becomes public only at submission.",
   "why": "Judges need a public repo at submission, but until then a remote is a backup, not a publication. Private keeps half-built code, recorded API responses and commit metadata off the open web until the submission check.",
   "changed_at": "2026-10-29T17:35:33.732Z"
  },
  {
   "id": "dec-mvtub2x0b82f",
   "date": "2026-10-29",
   "title": "Gate A means the three spikes; zero SAM instances do not pass; SAM latency counts only on responses with instances",
   "decision": "Gate A is d1-5 to d1-7 (Spark, SAM, Voice spikes) with p50 and p95 latency written to spikes/. It is not the 20-figure authoring eval, which comes after d1-8. A SAM response with zero instances is not a real result for the gate, and SAM latency is measured only on responses that return instances.",
   "why": "Deepak's reading of the gate definition, Oct 29. A completed stream with nothing in it shows the endpoint answers, not that S2 can use it; counting fast empty answers would flatter both the gate and the latency numbers.",
   "changed_at": "2026-10-29T17:51:27.113Z"
  },
  {
   "id": "dec-mvtvb7zone0k",
   "date": "2026-10-29",
   "title": "S2 approach pending bake-off: Arm A (Spark points to SAM) vs Arm B (deterministic regions named by Spark)",
   "decision": "No S2 approach is chosen yet. Step 4.1b runs both arms on heart.png and 2 eval figures of different styles, renders a contact sheet per figure under eval/s2-bakeoff/, and Deepak grades it. Arm A: Spark gives one point inside each part, SAM segments from the point. Arm B: code finds closed regions, Spark maps part names to region ids, no SAM.",
   "why": "The Oct 29 SAM diagnostic found the whole heart but no part of it with concept prompts in either phrasing, so S2 as planned (one SAM concept call per part) does not find parts on this figure.",
   "changed_at": "2026-10-29T18:19:33.305Z"
  },
  {
   "id": "dec-mvue5wjblttb",
   "date": "2026-10-29",
   "title": "Arm B is not the general S2 method: it fails on figures without dark outlines",
   "decision": "Arm B (code regions named by Spark) is not the general S2 method",
   "why": "heart.png is a colored illustration without dark outlines; Arm B's ink threshold found label text and leader lines, not anatomy. Heart Arm B: 1 pass of 14 graded.",
   "changed_at": "2026-10-30T03:07:17.882Z"
  },
  {
   "id": "dec-mvue5wkdd7am",
   "date": "2026-10-29",
   "title": "S2 direction: Arm A v2 (Spark points with guards, SAM, group unions); Arm B set aside pending v2 results",
   "decision": "Arm A v2, app/meta/s2_armav2.py; Arm B set aside",
   "why": "Arm B fails without dark outlines (heart), misassigned numbered regions on the map (Tohoku took Kanto, Kanto took a Chubu prefecture), and its naming calls took 42 s on the flower and 92 s on the map (14.5 s on the heart). Revisit only if Arm A v2 fails the flower's small parts.",
   "changed_at": "2026-10-30T03:07:17.919Z"
  },
  {
   "id": "dec-mvue5wlfpemk",
   "date": "2026-10-29",
   "title": "SAM confidence is not a review trigger on its own: some fails scored high (brachiocephalic sliver 0.820, stamen label 0.777) and some passes scored low (left pulmonary arteries 0.443).",
   "decision": "Do not use SAM confidence to decide which masks a person reviews",
   "why": "v1 Arm A, graded Oct 29. Fails at 0.70 or higher: brachiocephalic artery (sliver) 0.820, stamen group (label) 0.777, stigma (sliver) 0.711, Tohoku (partial) 0.711. A pass at 0.443: left pulmonary arteries.",
   "changed_at": "2026-10-30T03:14:13.225Z"
  },
  {
   "id": "dec-mvug8gojutyt",

   "decision": "A part 95% or more inside a larger mask, by its first mask, is nested in it whatever Spark said: its points are no spill for that mask. Tested against each mask the spill check reads (first or retry); the nesting S2 records and S3 uses is tested again on the masks kept. NEST_INSIDE 0.95, not the proposed 0.9.",

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nowISO(){return new Date().toISOString()}

function etDate(d){var p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d||new Date());var o={};p.forEach(function(x){o[x.type]=x.value});return o.year+'-'+o.month+'-'+o.day}

/* ---------- storage ---------- */
function readEmbedded(){return JSON.parse($('#tt-state').textContent)}
function ensure(a){
 ['tasks','gates','metrics','outreach','decisions','risks','costs','issues','log'].forEach(function(k){a[k]=a[k]||[]});
 a.ui=a.ui||{theme:'auto'};if(a.notes==null)a.notes='';if(!a.budget_usd)a.budget_usd=150;if(!a.rev)a.rev=1;return a;
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function mergeBoth(file,loc){
 var out=ensure(clone(file));loc=ensure(clone(loc));
 ['tasks','gates','metrics','outreach','risks','issues','decisions'].forEach(function(k){
  var idx={};out[k].forEach(function(x,i){idx[x.id]=i});
  loc[k].forEach(function(x){
   if(idx[x.id]===undefined){out[k].push(x);return}
   var f=out[k][idx[x.id]];if((x.changed_at||'')>(f.changed_at||''))out[k][idx[x.id]]=x;
  });
 });
 var seen={};out.log=out.log.concat(loc.log).filter(function(l){var key=l.ts+'|'+l.text;if(seen[key])return false;seen[key]=1;return true}).sort(function(a,b){return a.ts<b.ts?1:-1});
 var cs={};out.costs=out.costs.concat(loc.costs).filter(function(c){var key=c.ts+'|'+c.item;if(cs[key])return false;cs[key]=1;return true});
 if((loc.notes_changed_at||'')>(out.notes_changed_at||'')){out.notes=loc.notes;out.notes_changed_at=loc.notes_changed_at}
 out.ui=loc.ui||out.ui;
 return out;
}
function load(){
 var emb=ensure(readEmbedded());original=clone(emb);var loc=null;
 try{var r=localStorage.getItem(KEY);if(r)loc=ensure(JSON.parse(r))}catch(e){storageOK=false}
 if(!loc){state=clone(emb);state.base_rev=emb.rev}
 else if(emb.rev===loc.base_rev){state=loc;var miss=clone(emb);['tasks','gates','metrics','outreach','decisions','risks'].forEach(function(k){var ids={};state[k].forEach(function(x){ids[x.id]=1});miss[k].forEach(function(x){if(!ids[x.id])state[k].push(x)})});
  if(state.rev!==state.base_rev)banner='This browser has changes that are not in the file yet. Use Save to file so the repo has them.'}
 else{state=mergeBoth(emb,loc);state.base_rev=emb.rev;state.rev=Math.max(emb.rev,loc.rev||0)+1;
  banner=(loc.rev===loc.base_rev)?'The file changed since this browser last saw it, probably from Claude Code. It was loaded, with nothing lost. Save to file to confirm.':'The file and this browser both changed. They were merged, keeping the newest edit of each item. Save to file to keep the result.'}
 if(!storageOK)banner='This browser is blocking local storage here, so changes last only until you close the tab. Use Save to file often.';
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}
function persist(silent){
 state.rev=(state.rev||1)+1;state.updated_at=nowISO();
 try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}
 if(!silent)render();else renderStatusOnly();
}
function touch(o){if(o)o.changed_at=nowISO();return o}

function buildFileHTML(){

 $('#app',root).innerHTML='';
 root.removeAttribute('data-theme');
 var out=clone(state);delete out.base_rev;var json=JSON.stringify(out,null,1).replace(/</g,'\\u003c');
 $('#tt-state',root).textContent='\n'+json+'\n';
 return '<!DOCTYPE html>\n'+root.outerHTML;
}
function download(name,text,type){
 var b=new Blob([text],{type:type});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
function saveToFile(){
 var prevBase=state.base_rev;state.base_rev=state.rev;state.file_saved_at=nowISO();
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}

  (fileHandle?Promise.resolve(fileHandle):window.showSaveFilePicker({suggestedName:'TRACKER.html',types:[{description:'HTML file',accept:{'text/html':['.html']}}]}))
  .then(function(h){fileHandle=h;return h.createWritable()}).then(function(w){return w.write(html).then(function(){return w.close()})})
  .then(function(){done('Saved to TRACKER.html')})
  .catch(function(e){if(e&&e.name==='AbortError'){state.base_rev=prevBase;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(x){}render();return}download('TRACKER.html',html,'text/html');done('Downloaded TRACKER.html. Replace the copy in your repo with it.')});
 } else {download('TRACKER.html',html,'text/html');done('Downloaded TRACKER.html. Replace the copy in your repo with it.')}

function copyText(t){

function progress(list){list=list||live();var d=list.filter(function(t){return t.status==='done'}).length;return {done:d,total:list.length,pct:list.length?Math.round(d*100/list.length):0}}
function dayTasks(n){return state.tasks.filter(function(t){return t.day===n})}
function overdue(){var c=currentDay();return state.tasks.filter(function(t){return t.day<c&&(t.status==='todo'||t.status==='doing'||t.status==='blocked')})}
function metricState(m){if(m.value===null||m.value===''||m.value===undefined)return 'none';if(m.report_only)return 'report';var v=Number(m.value);return (m.cmp==='<='?v<=m.target:v>=m.target)?'pass':'fail'}

function dirty(){return state.rev!==state.base_rev}

function vPeople(){var st=['not contacted','emailed','replied','scheduled','done','no response'];
 return '<h2>Feedback</h2><p class="muted">The biggest risk is having no blind tester. Track every contact here. If nothing lands by Nov 3, the README says so plainly.</p>'+
 state.outreach.map(function(o){return '<div class="block person"><h3>'+esc(o.who)+' <small>'+esc(o.channel)+'</small></h3><div class="row"><label>Status <select data-act="ostatus" data-id="'+o.id+'">'+st.map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></label><label>Date <input type="date" data-act="odate" data-id="'+o.id+'" value="'+esc(o.date)+'"></label></div><label class="fl">Notes<textarea data-act="onote" data-id="'+o.id+'" rows="2">'+esc(o.note)+'</textarea></label></div>'}).join('')+
 '<div class="block"><h3>Add a contact</h3><div class="row"><label class="grow">Who <input id="owho" type="text"></label><label>How <input id="ochan" type="text" placeholder="Email, call, form"></label><button class="btn" data-act="oadd">Add contact</button></div></div>'}
function vDecisions(){return '<h2>Decisions</h2><p class="muted">Write down anything you would otherwise argue with yourself about later.</p>'+
 '<div class="block"><h3>Record a decision</h3><label class="fl">Decision<input id="dtitle" type="text" placeholder="Short title"></label><label class="fl">What we chose<textarea id="ddec" rows="2"></textarea></label><label class="fl">Why<textarea id="dwhy" rows="2"></textarea></label><button class="btn" data-act="dadd">Save decision</button></div>'+
 state.decisions.slice().reverse().map(function(d){return '<div class="block dec"><h3>'+esc(d.title)+' <small>'+esc(d.date)+'</small></h3><p>'+esc(d.decision)+'</p><p class="muted"><b>Why:</b> '+esc(d.why)+'</p></div>'}).join('')}
function vRisks(){return '<h2>Risks</h2>'+state.risks.map(function(r){return '<div class="block risk lv-'+r.level+'"><h3>'+esc(r.title)+' <small>'+esc(r.level)+'</small></h3><p>'+esc(r.plan)+'</p><div class="row"><label>Status <select data-act="rstatus" data-id="'+r.id+'">'+['open','watching','mitigated','happened'].map(function(s){return '<option'+(r.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></label></div></div>'}).join('')}
function vIssues(){var sev=['high','medium','low'];return '<h2>Issues</h2><p class="muted">Bugs, budget misses and anything that broke. A performance budget miss goes here with the measured number.</p>'+
 '<div class="block"><h3>New issue</h3><div class="row"><label class="grow">What broke <input id="ititle" type="text"></label><label>Severity <select id="isev">'+sev.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></label><button class="btn" data-act="iadd">Add issue</button></div></div>'+
 (state.issues.length?state.issues.map(function(i){return '<div class="block issue sev-'+i.severity+(i.status==='closed'?' closed':'')+'"><h3>'+esc(i.title)+' <small>'+esc(i.severity)+', opened '+esc(fmtET(i.ts))+'</small></h3><label class="fl">Notes<textarea data-act="inote" data-id="'+i.id+'" rows="2">'+esc(i.note)+'</textarea></label><div class="row"><label>Status <select data-act="istatus" data-id="'+i.id+'">'+['open','fixing','closed'].map(function(s){return '<option'+(i.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></label></div></div>'}).join(''):'<p class="empty">No issues. Good. Log the first one the moment something misbehaves.</p>')}
function vLog(){return '<h2>Log</h2><div class="block"><div class="row"><label for="llog" class="vh">Log entry</label><input id="llog" type="text" placeholder="What happened"><button class="btn" data-act="ladd">Add to log</button></div></div><ol class="log">'+state.log.map(function(l){return '<li class="k-'+esc(l.kind)+'"><time>'+esc(fmtET(l.ts))+'</time><span>'+esc(l.text)+'</span></li>'}).join('')+'</ol>'}
function vNotes(){return '<h2>Notes</h2><p class="muted">Scratch space. Saved when you click away.</p><textarea id="notes" class="notes" data-act="notes" rows="20" placeholder="Anything worth remembering">'+esc(state.notes)+'</textarea>'}
function vHandbook(){
 var tpl=$('#handbook');var frag=tpl.content.cloneNode(true);var div=document.createElement('div');div.appendChild(frag);
 var secs=div.querySelectorAll('section.hb');var toc='';var q=hbQuery.toLowerCase();var shown=0;
 secs.forEach(function(s){var h=s.querySelector('h2');var id=s.id;var hit=!q||s.textContent.toLowerCase().indexOf(q)>=0;if(!hit)s.setAttribute('hidden','');else shown++;toc+='<li'+(hit?'':' class="dim"')+'><a href="#'+id+'" data-act="hbjump" data-id="'+id+'">'+esc(h?h.textContent:id)+'</a></li>'});
 return '<h2>Handbook</h2><div class="filters"><label class="grow">Search the handbook <input type="search" data-act="hbsearch" value="'+esc(hbQuery)+'" placeholder="For example: homography, prices, dwell"></label></div>'+(q?'<p class="muted">'+shown+' sections match.</p>':'')+'<div class="hbwrap"><ol class="toc">'+toc+'</ol><div class="hbody">'+div.innerHTML+'</div></div>';
}
function vSearch(){var q=filt.q.toLowerCase();var ts=state.tasks.filter(function(t){return (t.title+' '+t.detail+' '+t.note).toLowerCase().indexOf(q)>=0});
 var tpl=$('#handbook');var div=document.createElement('div');div.appendChild(tpl.content.cloneNode(true));var hs=[].slice.call(div.querySelectorAll('section.hb')).filter(function(s){return s.textContent.toLowerCase().indexOf(q)>=0});
 return '<h2>Search: '+esc(filt.q)+'</h2><div class="block"><h3>Tasks <small>'+ts.length+'</small></h3>'+(ts.length?'<ul class="tasks">'+ts.map(taskRow).join('')+'</ul>':'<p class="empty">No tasks match.</p>')+'</div><div class="block"><h3>Handbook <small>'+hs.length+'</small></h3>'+(hs.length?'<ul class="plain">'+hs.map(function(s){return '<li><button class="link" data-act="hbopen" data-id="'+s.id+'">'+esc(s.querySelector('h2').textContent)+'</button></li>'}).join('')+'</ul>':'<p class="empty">No handbook sections match.</p>')+'</div>'}
var RENDER={today:vToday,tasks:vTasks,gates:vGates,metrics:vMetrics,budget:vBudget,people:vPeople,decisions:vDecisions,risks:vRisks,issues:vIssues,log:vLog,notes:vNotes,handbook:vHandbook,search:vSearch};
function applyTheme(){var t=state.ui.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
function render(){
 applyTheme();var app=$('#app');var focusId=document.activeElement&&document.activeElement.id;
 app.innerHTML='<a class="skip" href="#main">Skip to content</a>'+header()+'<div class="layout">'+nav()+'<main id="main" tabindex="-1">'+(RENDER[view]||vToday)()+'</main></div><div id="toast" role="status" aria-live="polite"></div><input type="file" id="importfile" accept="application/json,.json" hidden>';
 if(focusId){var el=document.getElementById(focusId);if(el&&el.tagName==='INPUT'){el.focus();try{var v=el.value;el.setSelectionRange(v.length,v.length)}catch(e){}}}
}
function renderStatusOnly(){var top=$('.acts');if(top){var p=$('.acts .pill');if(p){p.outerHTML=dirty()?'<span class="pill warn">Changes not saved to file</span>':'<span class="pill ok">File is up to date</span>'}}}

/* ---------- brief ---------- */
function brief(){
 var cur=currentDay(),p=progress();var L=[];
 L.push('# Talking Tactile status, '+fmtET(nowISO()));
 L.push('');L.push((cur<=10?'Day '+cur+' of 10 ('+DAYS[cur].label+'). Focus: '+DAYS[cur].focus:'Build window is over.'));
 L.push('Progress: '+p.done+' of '+p.total+' tasks ('+p.pct+'%). Time to our 3 PM ET target: '+(until(DATES.target)||'passed')+'.');
 L.push('Gates: '+state.gates.map(function(g){return g.id+' '+g.status}).join(', ')+'.');
 var open=cur<=10?dayTasks(cur).filter(function(t){return t.status!=='done'&&t.status!=='cut'}):[];
 L.push('');L.push('## Open today');open.length?open.forEach(function(t){L.push('- ['+t.id+'] '+t.title+(t.note?' (note: '+t.note+')':''))}):L.push('- none');
 var o=overdue();if(o.length){L.push('');L.push('## Overdue');o.forEach(function(t){L.push('- ['+t.id+'] D'+t.day+' '+t.title+' ('+t.status+')')})}
 var b=state.tasks.filter(function(t){return t.status==='blocked'});if(b.length){L.push('');L.push('## Blocked');b.forEach(function(t){L.push('- ['+t.id+'] '+t.title+': '+(t.note||'no note'))})}
 var is=state.issues.filter(function(i){return i.status!=='closed'});if(is.length){L.push('');L.push('## Open issues');is.forEach(function(i){L.push('- ('+i.severity+') '+i.title+(i.note?': '+i.note:''))})}
 var ms=state.metrics.filter(function(m){return metricState(m)!=='none'});if(ms.length){L.push('');L.push('## Measured');ms.forEach(function(m){L.push('- '+m.name+': '+m.value+' '+m.unit+' ('+metricState(m)+(m.source?', '+m.source:'')+')')})}
 L.push('');L.push('## Recent decisions');state.decisions.slice(-4).forEach(function(d){L.push('- '+d.title+': '+d.decision)});
 L.push('');L.push('## Credits');L.push('- $'+spent().toFixed(2)+' of $'+state.budget_usd+' spent');
 L.push('');L.push('## Last log entries');state.log.slice(0,6).forEach(function(l){L.push('- '+fmtET(l.ts)+': '+l.text)});
 L.push('');L.push('Follow CLAUDE.md and RULES.md. Update the state JSON in TRACKER.html when a task changes.');
 return L.join('\n');
}

/* ---------- events ---------- */
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i]}
function setTaskStatus(t,s){if(t.status===s)return;var prev=t.status;t.status=s;touch(t);t.done_at=s==='done'?nowISO():(prev==='done'?null:t.done_at);logEvent('Task '+t.id+' "'+t.title+'" is now '+s+'.')}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
 if(el.tagName==='SELECT'||el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&el.type!=='checkbox'))return;
 if(a==='toggle'){return}
 if(a==='view'){view=el.getAttribute('data-view');filt.q='';render();$('#main').focus();return}
 if(a==='goday'){filt.day=el.getAttribute('data-day');filt.status='all';view='tasks';render();return}
 if(a==='save'){saveToFile();return}
 if(a==='brief'){copyText(brief());return}
 if(a==='dismiss'){banner='';render();return}
 if(a==='export'){download('talking-tactile-state.json',JSON.stringify(state,null,1),'application/json');return}
 if(a==='import'){$('#importfile').click();return}
 if(a==='theme'){var o=['auto','light','dark'];state.ui.theme=o[(o.indexOf(state.ui.theme)+1)%3];try{localStorage.setItem(KEY,JSON.stringify(state))}catch(x){}render();return}
 if(a==='reset'){if(confirm('Replace everything in this browser with the state stored in the file? Unsaved browser changes will be lost.')){state=clone(original);state.base_rev=original.rev;try{localStorage.removeItem(KEY)}catch(x){}banner='Reset to the state stored in the file.';render()}return}
 if(a==='tdel'){if(confirm('Delete this task? Use Cut instead if you only dropped it from scope.')){state.tasks=state.tasks.filter(function(t){return t.id!==id});logEvent('Task '+id+' deleted.');persist()}return}
 if(a==='tadd'){var ti=$('#ntitle').value.trim();if(!ti){toast('Write the task first.');$('#ntitle').focus();return}var dn=Number($('#nday').value);var t=touch({id:uid('t'),day:dn,title:ti,detail:'',timebox:'',fallback:'',status:'todo',note:'',done_at:null,tags:['added']});state.tasks.push(t);logEvent('Task added to D'+dn+': '+ti);persist();return}
 if(a==='qlog'||a==='ladd'){var inp=$(a==='qlog'?'#qlog':'#llog');var v=inp.value.trim();if(!v){toast('Write the log entry first.');inp.focus();return}logEvent(v,'manual');persist();toast('Added to log');return}
 if(a==='cadd'){var it=$('#citem').value.trim(),u=parseFloat($('#cusd').value);if(!it||!(u>=0)){toast('Add what it was for and an amount.');return}state.costs.unshift({ts:nowISO(),item:it,usd:Math.round(u*100)/100});logEvent('Spend recorded: $'+u.toFixed(2)+' for '+it+'.');persist();return}
 if(a==='cdel'){state.costs.splice(Number(el.getAttribute('data-i')),1);persist();return}
 if(a==='oadd'){var w=$('#owho').value.trim();if(!w){toast('Add who you are contacting.');return}state.outreach.push(touch({id:uid('o'),who:w,channel:$('#ochan').value.trim(),status:'not contacted',date:'',note:''}));persist();return}
 if(a==='dadd'){var dt=$('#dtitle').value.trim(),dd=$('#ddec').value.trim();if(!dt||!dd){toast('A decision needs a title and what was chosen.');return}state.decisions.push(touch({id:uid('dec'),date:etDate(),title:dt,decision:dd,why:$('#dwhy').value.trim()}));logEvent('Decision: '+dt+'.');persist();return}
 if(a==='iadd'){var itl=$('#ititle').value.trim();if(!itl){toast('Describe what broke.');return}state.issues.unshift(touch({id:uid('i'),ts:nowISO(),title:itl,severity:$('#isev').value,status:'open',note:''}));logEvent('Issue opened: '+itl+'.');persist();return}
 if(a==='hbjump'){e.preventDefault();var s=document.getElementById(id);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(a==='hbopen'){view='handbook';hbQuery='';filt.q='';render();var s2=document.getElementById(id);if(s2)s2.scrollIntoView({block:'start'});return}
 if(a==='copy'){var src=document.getElementById(el.getAttribute('data-src'));if(src)copyText(src.textContent.trim());return}
});
document.addEventListener('change',function(e){
 var el=e.target;var a=el.getAttribute('data-act');var id=el.getAttribute('data-id');
 if(el.id==='importfile'){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var s=JSON.parse(r.result);if(!s||!Array.isArray(s.tasks))throw new Error('not a tracker file');var b=state.base_rev;state=ensure(s);state.base_rev=b;logEvent('State imported from '+f.name+'.');persist();toast('Imported')}catch(x){toast('That file is not a Talking Tactile tracker export.')}};r.readAsText(f);return}
 if(!a)return;
 if(a==='toggle'){var t=find(state.tasks,id);setTaskStatus(t,el.checked?'done':'todo');persist();return}
 if(a==='tstatus'){setTaskStatus(find(state.tasks,id),el.value);persist();return}
 if(a==='tnote'){touch(find(state.tasks,id)).note=el.value;persist(true);return}
 if(a==='gstatus'){var g=touch(find(state.gates,id));g.status=el.value;logEvent('Gate '+id+' is now '+el.value+'.');persist();return}
 if(a==='gev'){touch(find(state.gates,id)).evidence=el.value;persist(true);return}
 if(a==='mval'){var m=touch(find(state.metrics,id));m.value=el.value===''?null:Number(el.value);m.measured_at=el.value===''?null:nowISO();logEvent('Metric "'+m.name+'" set to '+(m.value==null?'empty':m.value+' '+m.unit)+'.');persist();return}
 if(a==='msrc'){touch(find(state.metrics,id)).source=el.value;persist();return}
 if(a==='ostatus'){var o=touch(find(state.outreach,id));o.status=el.value;logEvent('Feedback contact '+o.who+': '+el.value+'.');persist();return}
 if(a==='odate'){touch(find(state.outreach,id)).date=el.value;persist(true);return}
 if(a==='onote'){touch(find(state.outreach,id)).note=el.value;persist(true);return}
 if(a==='rstatus'){var rk=touch(find(state.risks,id));rk.status=el.value;logEvent('Risk "'+rk.title+'" is now '+el.value+'.');persist();return}
 if(a==='istatus'){var is=touch(find(state.issues,id));is.status=el.value;logEvent('Issue "'+is.title+'" is now '+el.value+'.');persist();return}
 if(a==='inote'){touch(find(state.issues,id)).note=el.value;persist(true);return}
 if(a==='notes'){state.notes=el.value;state.notes_changed_at=nowISO();persist(true);return}
 if(a==='fday'){filt.day=el.value;render();return}
 if(a==='fstatus'){filt.status=el.value;render();return}
});
document.addEventListener('input',function(e){
 var a=e.target.getAttribute('data-act');
 if(a==='gsearch'){filt.q=e.target.value;if(filt.q.trim().length>=2){view='search'}else if(view==='search'){view='today'}render();return}
 if(a==='ftq'){filt.tq=e.target.value;var pos=e.target.selectionStart;render();var n=$('[data-act="ftq"]');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(a==='hbsearch'){hbQuery=e.target.value;var p2=e.target.selectionStart;render();var n2=$('[data-act="hbsearch"]');if(n2){n2.focus();n2.setSelectionRange(p2,p2)}return}
});
document.addEventListener('keydown',function(e){
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();var q=$('#q');if(q)q.focus()}
 if(e.key==='Enter'&&document.activeElement&&['qlog','llog','ntitle'].indexOf(document.activeElement.id)>=0){e.preventDefault();var map={qlog:'qlog',llog:'ladd',ntitle:'tadd'};var b=$('[data-act="'+map[document.activeElement.id]+'"]');if(b)b.click()}
});
window.addEventListener('beforeunload',function(e){if(dirty()&&!storageOK){e.preventDefault();e.returnValue=''}});
window.TT={brief:brief,buildFileHTML:buildFileHTML,get state(){return state}};
load();render();
setInterval(function(){var c=$('.clock');if(c&&!document.activeElement.matches('textarea,input')){render()}},60000);
})();

</script>
</body>
</html>
