# Tactile design constants. Every value has a source.
# Before the final render, re-check each value against the BANA
# Guidelines and Standards for Tactile Graphics, 2022 edition.

spacing:
  min_gap_mm: 3.2            # 1/8 inch absolute minimum between elements. tactilegraphics.org readability page
  point_symbol_min_mm: 6.4   # 1/4 inch minimum point symbol. APH "Planning and Designing Quality Tactile Graphics" handout

textures:
  max_area_textures: 5           # APH handout, "limit of 5"
  max_area_textures_lower_grades: 3  # APH handout, "limit of 3 for lower grades"
  lower_grade_bands: [k5]            # APH gives no cut-off for "lower grades"; we take K to 5
  order: [dots, lines, grid, cross, solid]  # handed out in this order, largest group first. Solid last:
                                            # large solid raised areas are hard to read. Engineering choice

braille:                     # BANA signage guideline values. Paper braille may differ.
  dot_base_diameter_mm: [1.5, 1.6]
  cell_to_cell_mm: [6.1, 7.6]      # corresponding dots in adjacent cells
  line_spacing_mm: 10.2            # dot 1 to dot 1, NPS Harpers Ferry tactile map guidelines
  clearance_to_line_mm: 3.7        # braille dots to nearest tactile line, NPS guidelines
  dot_to_dot_mm: [2.3, 2.5]        # dots in the same cell. ADA 2010 Standards table 703.3.1, the
                                   # source of the signage ranges above. Placement uses the low end of each range
  table: en-ueb-g2.ctb             # liblouis Unified English Braille, grade 2
  display: unicode.dis
  search_step_mm: 0.5              # placement search grid. Engineering
  max_outside_offset_mm: 15.0      # an abbreviation placed beside its part stays this close. Engineering
  abbrev_letters: 2                # abbreviations start this long and grow until unique. Engineering
  translate_timeout_s: 10.0        # one lou_translate call for all labels of a figure

page:
  sizes: [letter, a4]
  dimensions_mm:                   # width, height. ANSI Letter and ISO 216 A4
    letter: [215.9, 279.4]
    a4: [210.0, 297.0]
  margin_mm: 25.4                  # 1 inch on every side; the figure is fitted inside it. Engineering choice:
                                   # room for registration marks and the calibration bar. Check against BANA 2022
  calibration_bar_mm: 100          # printed on every sheet so scaling can be checked with a ruler

pipeline:                          # engineering values, not design rules
  normalize_max_side_px: 2048      # PLAN.md section 6, S0: longest side of the normalized image
  max_upload_mb: 10                # PLAN.md section 5.3 upload guard
  pdf_render_dpi: 200              # a PDF page is rendered at this resolution before normalizing
  min_sharpness: 0.15              # p99.5 gradient over intensity range at 2048 px. Measured Oct 24 on the synthetic
                                   # figure and heart.png: sharp 0.49-0.56, Gaussian blur 2 px 0.22-0.27, 4 px 0.09-0.13
  deskew_min_area_fraction: 0.2    # a photographed page must fill at least this much of the photo
  deskew_max_area_fraction: 0.98   # a four-sided outline this large is the image border, not a page
  deskew_min_contrast: 40          # the page must be this much brighter (0-255) than what surrounds it

meta:                              # Meta Model API use. Prices from the pricing page as quoted in PLAN.md 5.4;
                                   # confirm against live usage on Day 1
  budget_usd: 150                  # hackathon credits
  warn_at_fractions: [0.7, 0.9]    # PLAN.md 5.3: warn at 70 and 90 percent of the budget
  max_parts: 25                    # PLAN.md S1: up to 25 parts per figure
  sam_concurrency: 4               # PLAN.md S2: four SAM calls at a time
  text_phrase: text label          # S2 also asks SAM for print text, so it can be cut out of the raised layer
  prices_usd:
    muse-spark-1.3: { input_per_mtok: 1.25, cached_input_per_mtok: 0.15, output_per_mtok: 4.25 }
    sam-3.1: { per_image: 0.0025 }
    muse-voice-transcribe-1.0: { per_audio_hour: 0.18 }

reconcile:                         # S3 rules on raw masks. Engineering values, tuned on the eval figures
  duplicate_iou: 0.8               # PLAN.md section 6, S3: merge near duplicates above this overlap
  contain_fraction: 0.95           # share of the smaller mask inside the larger one to nest it
  speck_max_area_mm2: 2.0          # connected pieces smaller than this are noise
  sliver_max_width_mm: 1.0         # a mask thinner than this everywhere is dropped

vectorize:                         # S4 masks to polygons. The 200 point cap comes from regions.schema.json
  simplify_tolerance_mm: 0.1       # first Douglas-Peucker tolerance; doubled until the cap is met

layout:                            # S4 fixes. Engineering values
  point_symbol_vertices: 32        # a point symbol is a regular polygon this fine, at least point_symbol_min_mm wide
  gap_simplify_tolerance_mm: 0.05  # outlines cut back for a gap are simplified this much, and cut twice this deeper
  gap_max_passes: 8                # gap enforcement repeats until clean or this many passes
  color_group_max_delta: 40        # RGB distance under which two fills count as the same color
  inside_point_tolerance_mm: 0.1   # precision of the point inside a region (point symbol center, centroid_mm)
  neighbor_max_gap_mm: 20.0        # regions this close are listed as neighbors in regions.json

render:                            # S5 drawing. Engineering values; check on the first traced sheet
  outline_width_mm: 1.0            # raised outline, drawn inside each part's edge, so the gap between two
                                   # parts stays true. Nested parts and braille inside a part add this width
  texture_line_mm: 0.5             # lines in the lines, grid and cross textures
  texture_dot_mm: 1.5              # dots in the dots texture
  texture_spacing_mm: 5.0          # between texture lines or dots
  texture_min_piece_mm: 4.0        # texture line pieces shorter than this are left out: too short to feel as a line
  guide_line_mm: 0.3               # print-only guides: registration marks and the calibration bar
  mark_arm_mm: 8.0                 # length of each arm of the L-shaped corner marks
  print_text_mm: 3.0               # print text for the teacher (title, instructions, key words)
  bar_height_mm: 1.0               # the 100 mm calibration bar is a filled bar this tall
  key_swatch_mm: [30.0, 20.0]      # width, height of each texture sample on the key page
  coordinate_decimals: 2           # page mm in tactile.svg and regions.json are rounded to this

principles:
  - represent, not interpret       # APH handout
  - spacing is the key to avoiding clutter
  - eliminate unnecessary elements of the original picture
